name: Claude Code

on:
  # Only the CODEOWNERS check below and the action's own write-access check let a comment run Claude;
  # the job checks out the default branch, never a pull request's code.
  issue_comment: # zizmor: ignore[dangerous-triggers] gated on CODEOWNERS, see above
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check actor is in CODEOWNERS
        id: auth-check
        env:
          ACTOR: ${{ github.actor }}
        run: |
          ALLOWED=$(grep -oP '(?<=@)\S+' .github/CODEOWNERS | sort -u)
          if echo "$ALLOWED" | grep -qx "$ACTOR"; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Actor '$ACTOR' is not in CODEOWNERS — skipping."
          fi

      - name: Install Claude Code v2.1.18
        run: | # zizmor: ignore[adhoc-packages] exact version pinned below
          # Remove any existing claude installation
          sudo rm -f /usr/local/bin/claude
          # Install specific version via npm (exact version, so no lockfile is needed)
          npm install -g @anthropic-ai/claude-code@2.1.18
          # Verify the path and version
          CLAUDE_BIN=$(which claude)
          echo "CLAUDE_PATH=$CLAUDE_BIN" >> "$GITHUB_ENV"
          echo "Claude binary location: $CLAUDE_BIN"
          echo "Installed Claude Code version:"
          claude --version

      - name: Run Claude Code
        if: steps.auth-check.outputs.allowed == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1.0.268
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ env.CLAUDE_PATH }}
