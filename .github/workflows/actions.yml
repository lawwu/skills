# Checks the workflows themselves on every pull request.
# - "Actions lock" fails if a workflow uses an action that .github/workflows/actions.lock
#   doesn't cover, or if a locked commit no longer matches upstream (a moved tag, rewritten
#   history, a deleted and recreated repository). Relock with `gh actions-lock` after
#   changing a workflow.
# - "zizmor" lints the workflows for security problems (broad token permissions, credentials
#   left on disk, template injection), including the audits that ask GitHub (actions with
#   known vulnerabilities, impostor commits). Run it locally with `uvx zizmor .github/`.
name: actions
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lockfile:
    name: Actions lock
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: 1.32.0
          advanced-security: false # findings fail the job, as annotations on the pull request
          annotations: true
